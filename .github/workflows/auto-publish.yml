name: Auto-publish Blogger post

on:
  schedule:
    # GitHub drops/delays most scheduled ticks (observed: ~3 of 18 a day, delays
    # up to ~85 min), so each window is polled densely and the decide step below
    # is what actually rate-limits publishing to one post per slot per day.
    - cron: "*/30 0-5 * * *"   # KST 09:00-14:30 - am slot + grace tail
    - cron: "*/30 6-11 * * *"  # KST 15:00-20:30 - pm slot + grace tail
  workflow_dispatch:
    inputs:
      force:
        description: "Publish one queued post immediately"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this slot should run
        id: decide
        shell: bash
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if [[ "$FORCE" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "slot=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          read -r ymd hh mm <<< "$(TZ=Asia/Seoul date '+%Y-%m-%d %H %M')"
          # 10# is required: "09" is an invalid octal literal inside (( )), which
          # would make every comparison below silently evaluate to false.
          now=$(( 10#$hh * 60 + 10#$mm ))

          # KST slot windows, in minutes from midnight. Each window is the
          # publish period plus a grace tail that absorbs GitHub's scheduler
          # delay, so a tick that arrives late still publishes instead of
          # falling outside every slot and losing the day.
          if (( now >= 540 && now < 900 )); then      # 09:00 - 14:59
            slot="am"
            start=540
            range=90                                  # jitter over 09:00 - 10:29
          elif (( now >= 900 && now < 1260 )); then   # 15:00 - 20:59
            slot="pm"
            start=900
            range=90                                  # jitter over 15:00 - 16:29
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git log --since="$ymd 00:00:00" --grep="\[auto-publish $slot\]" --format=%H | grep -q .; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Both sides are minutes since the slot opened - keep the units aligned.
          elapsed=$(( now - start ))
          if (( elapsed >= range )); then
            # Past the jitter window: take the first tick we are given.
            target=0
          else
            seed=$(printf '%s' "$ymd-$slot" | sha256sum | cut -c1-8)
            target=$(( 16#$seed % range ))
          fi
          if (( elapsed < target )); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - name: Validate CI credentials
        if: steps.decide.outputs.run == 'true'
        env:
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: test -n "$BLOGGER_REFRESH_TOKEN" || (echo 'BLOGGER_REFRESH_TOKEN secret is missing' >&2; exit 1)

      - name: Install dependencies
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        if: steps.decide.outputs.run == 'true'
        run: npm ci

      - name: Publish next post
        if: steps.decide.outputs.run == 'true'
        id: publish
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_TOKEN_PROD: ${{ secrets.BLOGGER_TOKEN_PROD }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: npx ts-node tools/auto-publish-next.ts --dir content/dev/database

      - name: Commit and push write-back
        if: steps.publish.outputs.published == 'true'
        env:
          SLOT: ${{ steps.decide.outputs.slot }}
          TITLE: ${{ steps.publish.outputs.title }}
          FILE: ${{ steps.publish.outputs.file }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$FILE"
          git commit -m "publish(dev): $TITLE [auto-publish $SLOT]"
          git pull --rebase origin main
          git push origin HEAD:main
