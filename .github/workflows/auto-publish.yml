name: Auto-publish Blogger post

on:
  schedule:
    # Poll densely because GitHub may delay or drop individual scheduled runs.
    # The decide step rate-limits publishing to one post per slot per KST day.
    - cron: "*/30 0-5 * * *"   # KST 09:00-14:30 - am slot + grace tail
    - cron: "*/30 6-11 * * *"  # KST 15:00-20:30 - pm slot + grace tail
    - cron: "20 7 * * *"       # TEMP test: 16:20 KST, remove after verification
  workflow_dispatch:
    inputs:
      force:
        description: "Publish one queued post immediately"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this slot should run
        id: decide
        shell: bash
        env:
          FORCE: ${{ inputs.force || false }}
          SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          if [[ "$FORCE" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "slot=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ymd=$(TZ=Asia/Seoul date '+%Y-%m-%d')
          # Do not infer the slot from the runner's current clock. GitHub can
          # deliver a scheduled run late, after the original slot's KST window.
          # The schedule expression is the stable identity of the slot.
          if [[ "$SCHEDULE" == '*/30 0-5 * * *' ]]; then
            slot="am"
          elif [[ "$SCHEDULE" == '*/30 6-11 * * *' ]]; then
            slot="pm"
          elif [[ "$SCHEDULE" == '20 7 * * *' ]]; then
            slot="pm"
          elif [[ -z "$SCHEDULE" ]]; then
            echo "Manual run requires force=true; nothing to publish."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "Unsupported schedule: $SCHEDULE" >&2
            exit 1
          fi

          # Include the KST offset; without it Git interprets the boundary in
          # the Ubuntu runner's UTC timezone and can inspect the wrong day.
          if git log --since="${ymd}T00:00:00+09:00" --grep="\[auto-publish $slot\]" --format=%H | grep -q .; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every delivered tick is eligible. Dense polling plus the marker
          # above makes this resilient to delayed/missing cron deliveries.
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - name: Validate CI credentials
        if: steps.decide.outputs.run == 'true'
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_TOKEN_PROD: ${{ secrets.BLOGGER_TOKEN_PROD }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          set -euo pipefail
          for name in BLOGGER_CLIENT_ID BLOGGER_TOKEN_PROD BLOGGER_REFRESH_TOKEN BLOGGER_BLOG_ID; do
            [[ -n "${!name}" ]] || { echo "$name secret is missing" >&2; exit 1; }
          done

      - name: Install dependencies
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        if: steps.decide.outputs.run == 'true'
        run: npm ci

      - name: Publish next post
        if: steps.decide.outputs.run == 'true'
        id: publish
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_TOKEN_PROD: ${{ secrets.BLOGGER_TOKEN_PROD }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: npx ts-node tools/auto-publish-next.ts --dir content/dev/database

      - name: Commit and push write-back
        if: steps.publish.outputs.published == 'true'
        env:
          SLOT: ${{ steps.decide.outputs.slot }}
          TITLE: ${{ steps.publish.outputs.title }}
          FILE: ${{ steps.publish.outputs.file }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$FILE"
          git commit -m "publish(dev): $TITLE [auto-publish $SLOT]"
          git pull --rebase origin main
          git push origin HEAD:main
